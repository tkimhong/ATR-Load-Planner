<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATR tech log</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .sub {
        margin-top: 2px;
        font-size: 12px;
        color: #888;
      }

      .sub a {
        color: #666;
      }

      #pilotId {
        width: 100%;
      }

      .spaced {
        margin-top: 16px;
      }

      .warn {
        color: #8a6d3b;
      }

      .note {
        margin-top: 10px;
        font-size: 12px;
        color: #8a6d3b;
      }

      td:first-child {
        width: 130px;
        font-size: 12px;
        color: #666;
      }

      #fields td + td {
        text-align: left;
        font-family: inherit;
      }

      #fields td input {
        width: 100%;
        padding: 6px 8px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }

      pre {
        margin: 14px 0 0;
        padding: 10px;
        background: #f6f6f6;
        border: 1px solid #e5e5e5;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ATR tech log</h1>
      <p class="sub">
        Paste the PIREP, copy the spreadsheet row. <a href="./">load planner</a>
      </p>

      <section>
        <label for="pilotId">Pilot ID</label>
        <input
          id="pilotId"
          type="text"
          autocomplete="off"
          placeholder="e.g. ABC123"
        />

        <label for="simbriefId" class="spaced">SimBrief user ID</label>
        <form
          class="row"
          onsubmit="
            fetchOFP();
            return false;
          "
        >
          <input
            id="simbriefId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="e.g. 123456"
          />
          <button type="submit">Fetch OFP</button>
        </form>
      </section>

      <section>
        <label for="pirep">PIREP flight data</label>
        <textarea
          id="pirep"
          rows="8"
          spellcheck="false"
          placeholder="Paste the PIREP block"
        ></textarea>
        <div class="row actions">
          <button onclick="build()">Build row</button>
        </div>
        <div id="status" class="status" hidden></div>
      </section>

      <section id="rowCard" hidden>
        <table id="fields"></table>
        <p id="note" class="note"></p>
        <div class="row actions">
          <button onclick="copyRow()">Copy row</button>
        </div>
        <pre id="preview"></pre>
      </section>
    </main>

    <script src="techlog.js"></script>
  </body>
</html>
