<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tech log</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Tech log</h1>
      <p class="sub"><a href="./">load planner</a> · tech log</p>

      <section>
        <label for="pilotId">Pilot ID</label>
        <input
          id="pilotId"
          type="text"
          autocomplete="off"
          placeholder="e.g. ABC123"
        />

        <label for="simbriefId" class="spaced">SimBrief user ID</label>
        <form
          class="row"
          onsubmit="
            fetchOFP();
            return false;
          "
        >
          <input
            id="simbriefId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="e.g. 123456"
          />
          <button type="submit">Fetch OFP</button>
        </form>
      </section>

      <section>
        <label for="pirep">PIREP flight data</label>
        <textarea
          id="pirep"
          rows="8"
          spellcheck="false"
          placeholder="Paste the PIREP block"
        ></textarea>
        <div class="row actions">
          <button onclick="build()">Build row</button>
        </div>
        <div id="status" class="status" hidden></div>
      </section>

      <section id="rowCard" hidden>
        <p class="aircraft">
          <span id="operator"></span> <span id="reg"></span>
        </p>

        <label for="prevArr">Previous landing (kg)</label>
        <input
          id="prevArr"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="paste the last row, or type the figure"
        />
        <p id="prevValue" class="prev-value"></p>

        <table id="fields"></table>
        <p id="note" class="note"></p>

        <div class="row actions">
          <button id="copyBtn" onclick="copyRow()">Copy row</button>
          <a
            href="#"
            onclick="
              clearAll();
              return false;
            "
            >Clear</a
          >
        </div>
        <pre id="preview"></pre>
      </section>
    </main>

    <script src="techlog.js"></script>
  </body>
</html>
